server {
    listen 8080;
    server_name _;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; media-src 'self'; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Only date-scoped MP4 paths are eligible for direct file serving. The
    # camera root is the sole filesystem mount visible to nginx.
    location ~ "^/videos/(?<day_path>(?:[0-9]{4}/[0-9]{2}/[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}))/(?<video_name>[^/]+[.]mp4)$" {
        alias /data/input/$day_path/$video_name;
        disable_symlinks on from=/data/input;
        limit_except GET { deny all; }
    }

    location /videos/ {
        return 404;
    }

    location / {
        proxy_pass http://viewer:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
