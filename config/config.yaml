timezone: Asia/Tokyo

paths:
  input: /data/input
  output: /data/output
  state: /data/state
  state_database_name: state.sqlite
  temp: /tmp/reolink-analyzer

schedule:
  target: previous_day

input:
  stable_seconds: 120
  # Snapshot all files, wait once, and require size+mtime to remain identical.
  stability_recheck_sec: 2
  ffprobe_timeout_sec: 60
  extensions: [.mp4]

frames:
  interval_sec: 1
  max_long_edge_px: 1280
  jpeg_quality: 85
  ffmpeg_timeout_sec: 900
  resolution_reduction:
    enabled: true
    daytime_max_long_edge_px: 768
    sample_frames: 5
    interval_sec: 1
    sample_width: 160
    sample_height: 90
    saturation_threshold: 20
    dark_luminance_threshold: 40
    dark_ratio_threshold: 0.20

genai:
  provider: openai
  model: gpt-5.6-luna
  max_images_per_request: auto
  # Keep multimodal requests reasonably small; long events are chunked.
  max_inline_image_bytes: 13000000
  chunk_overlap_frames: 2
  request_timeout_sec: 180
  max_output_tokens: 8192
  retry:
    max_attempts: 4
  pricing:
    input_per_million_tokens: 0.20
    output_per_million_tokens: 1.20
    currency: USD

prompts:
  event: prompts/event_observation_v1.txt
  event_synthesis: prompts/event_synthesis_v1.txt
  daily_report: prompts/daily_report_v1.txt
  event_version: event_observation_v1
  event_synthesis_version: event_synthesis_v1
  daily_report_version: daily_report_v1

report:
  json: true
  markdown: true
  html: true
  language: ja

processing:
  continue_on_error: true
