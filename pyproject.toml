[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reolink-daily-observer"
version = "0.1.0"
description = "One-shot daily semantic observation pipeline for Reolink MP4 recordings"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "openai>=2.0.0,<3",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "PyYAML>=6.0.2,<7",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
# Local person detection. Kept out of the default dependencies because torch is
# two orders of magnitude larger than everything else here, and neither the
# tests nor a run with person_filter disabled need it. The container image
# installs this extra; `uv sync` on a development machine does not.
detect = [
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
  "pillow>=11.0,<12",
]
dev = [
  "pytest>=8.4.0,<9",
  "pytest-cov>=6.2.0,<7",
]

[tool.uv.sources]
# The default PyPI wheel drags in the CUDA runtime. The deployment target is a
# Ryzen 7 6800U with no GPU, so the CPU build keeps several gigabytes out of
# the image. macOS wheels are CPU-only on PyPI already and are left alone.
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
reolink-daily = "app.run_daily:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true
