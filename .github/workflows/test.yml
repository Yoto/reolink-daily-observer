name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.26
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra viewer
      - name: Run tests
        run: uv run pytest -W error
